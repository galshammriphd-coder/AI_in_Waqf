<style>
html,body{margin:0;direction:rtl;background:#F5F6F8;color:#0E1E3A}
[hidden]{display:none!important}
body.locked{font-family:'Alexandria',system-ui,sans-serif;}
.boot{font-family:'Alexandria',system-ui,sans-serif;text-align:center;color:#5B677E;padding-top:40vh;margin:0}
.unused{min-height:100vh;display:grid;place-items:center;font-family:'Alexandria','Noto Naskh Arabic',system-ui,sans-serif;padding:1rem}
.gate{width:min(26rem,100%);text-align:center}
.gate svg{width:7rem;height:auto;display:block;margin:0 auto 1.25rem}
.gate h1{font-size:1.7rem;line-height:1.4;margin:0 0 .4rem}
.gate h1 span{color:#B4593B}
.gate p{color:#5B677E;margin:0 0 1.5rem;line-height:1.8;font-size:1rem}
.gate form{display:flex;flex-direction:column;gap:.75rem}
.gate input{font:inherit;font-size:1.05rem;padding:.8rem 1rem;border:1px solid #D8DDE6;border-radius:12px;background:#fff;text-align:center;direction:ltr}
.gate input:focus-visible,.gate button:focus-visible{outline:3px solid #B4593B;outline-offset:2px}
.gate button{font:inherit;font-weight:600;font-size:1.05rem;border:0;border-radius:999px;padding:.8rem;background:#B4593B;color:#fff;cursor:pointer}
.gate button:hover{background:#9C4A2F}
.gate button[disabled]{opacity:.7;cursor:progress}
.gate .err{color:#A93A26;font-size:.95rem;min-height:1.5rem;margin:0}
.gate small{display:block;margin-top:2rem;color:#8A94A8;font-size:.82rem;line-height:1.7}
/* protection */
body.open{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.open input,body.open textarea{-webkit-user-select:text;user-select:text}
body.open img,body.open svg{-webkit-user-drag:none}
.wm{position:fixed;inset:0;pointer-events:none;z-index:60;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='260'><text x='20' y='150' transform='rotate(-24 210 130)' font-family='sans-serif' font-size='17' fill='%230E1E3A' fill-opacity='0.05'>ورشة الأوقاف · د. غالب الشمري · نسخة محمية</text></svg>")}
.print-block{display:none}
@media print{
  body>*{display:none!important}
  body::before{content:"هذه المادة التدريبية محمية ولا يُسمح بطباعتها. للحصول على نسخة، تواصل مع المدرب.";display:block;font-family:sans-serif;font-size:18pt;text-align:center;padding-top:40vh;direction:rtl}
}
